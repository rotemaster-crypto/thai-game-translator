name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp app/build/outputs/apk/release/*.apk out/ThaiGameTranslator.apk 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: out/
      - name: Publish APK to build-output branch
        if: always()
        run: |
          cd out
          git init -q -b build-output
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-output
